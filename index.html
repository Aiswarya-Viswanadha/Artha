<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Artha – Live Today. Grow Tomorrow.</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-view="home">
    <!-- First page -->
    <section id="welcome" aria-label="Welcome to Artha">
        <div class="wc">
            <div class="wl">
                <svg class="mk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" aria-hidden="true">
                    <rect width="40" height="40" rx="10" fill="#245A43" />
                    <path d="M11 29L20 10l9 19" fill="none" stroke="#D9EF9E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M15.5 23h9" stroke="#D9EF9E" stroke-width="3.5" stroke-linecap="round" />
                </svg>
                <b>Artha</b>
            </div>
            <h1>Take Control<br>of Your Finances</h1>
            <p>Spend smart, save more,<br>reach your goals.</p>
            <div class="art">
                <svg viewBox="0 0 360 290" role="img" aria-label="Illustration of a person checking their phone at sunrise over a city">
                    <circle cx="255" cy="120" r="58" fill="#D9EF9E" opacity=".35" />
                    <circle cx="255" cy="120" r="26" fill="#D9EF9E" />
                    <g fill="#245A43" opacity=".28">
                        <rect x="262" y="70" width="12" height="90" /><rect x="282" y="112" width="16" height="48" /><rect x="304" y="124" width="14" height="36" /><rect x="320" y="104" width="18" height="56" /><rect x="232" y="132" width="14" height="28" />
                    </g>
                    <path d="M0 165 C60 140 120 160 190 150 C250 142 300 158 360 148 L360 290 L0 290Z" fill="#245A43" opacity=".22" />
                    <g fill="#245A43"><rect x="300" y="170" width="10" height="60" opacity=".7" /><path d="M305 120c-34 6-44 40-30 62 6 10 20 14 30 14s26-4 32-14c14-22 6-56-32-62z" /><path d="M290 150c-20 8-24 28-14 42 14-6 22-24 14-42z" fill="#4F836B" /></g>
                    <rect x="0" y="228" width="360" height="62" fill="#F6FAE6" />
                    <rect x="70" y="214" width="230" height="22" fill="#EAF6C8" />
                    <path d="M92 90C70 90 62 130 72 176c6 30 42 34 54 4 8-40 4-90-34-90z" fill="#173B2C" />
                    <ellipse cx="116" cy="106" rx="14" ry="17" fill="#F6FAE6" />
                    <path d="M72 168c-12 40-2 74 40 82l66-2c14-26 8-66-18-82z" fill="#4F836B" />
                    <path d="M112 250l86-10 30 22-8 10-98-4z" fill="#173B2C" />
                    <path d="M150 178l-12-56 22-8 14 48z" fill="#4F836B" />
                    <rect x="146" y="104" width="16" height="28" rx="3" transform="rotate(14 154 118)" fill="#1B4634" />
                    <path d="M0 262c20-24 36-10 40 12-18 4-34 4-40-12z" fill="#245A43" /><path d="M10 240c14-6 26 4 24 22-12-2-22-10-24-22z" fill="#4F836B" />
                </svg>
            </div>
            <button class="btn go" data-start>Get Started →</button>
            <p class="si">Already have an account? <button class="lnk" data-start>Sign In</button></p>
        </div>
    </section>

    <a class="skip" href="#main">Skip to content</a>
    <header class="top"><button class="brand" data-go="home" aria-label="Artha – go to Home"><svg class="mk"
                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Artha logo">
                <rect width="40" height="40" rx="10" fill="#245A43" />
                <path d="M11 29L20 10l9 19" fill="none" stroke="#D9EF9E" stroke-width="3.5" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M15.5 23h9" stroke="#D9EF9E" stroke-width="3.5" stroke-linecap="round" />
            </svg><span><b class="logo">Artha</b><span class="tag">Live Today. Grow Tomorrow.</span></span></button>
        <div class="sp"></div><button class="ic" data-go="notes" aria-label="Notifications">🔔<i id="bell"
                hidden></i></button><button class="ic av2" id="av" data-go="profile"
            aria-label="Profile and settings">U</button>
    </header>
    <nav id="nav" aria-label="Main"><button data-go="home"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
            </svg>Home</button><button data-go="manage"><svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="3" width="14" height="18" rx="2" />
                <path d="M9 8h6M9 12h6M9 16h4" />
            </svg>Manage</button><button class="add" data-add aria-label="Add expense or income"><i>+</i><span>Add</span></button><button data-go="grow"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 17l6-6 4 4 8-8M15 7h6v6" />
            </svg>Invest</button><button data-go="enjoy"><svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M8 14s1.5 3 4 3 4-3 4-3M9 9.5h.01M15 9.5h.01" />
            </svg>Fun</button></nav>
    <main id="main">
        <section id="v-home"></section>
        <section id="v-manage" hidden></section>
        <section id="v-grow" hidden></section>
        <section id="v-enjoy" hidden></section>
        <section id="v-plan" hidden></section>
        <section id="v-notes" hidden></section>
        <section id="v-profile" hidden></section>
    </main>
    <dialog id="dlg"></dialog>
    <dialog id="add" class="sheet" aria-label="Add transaction"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
</body>

</html>
