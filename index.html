```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#245C46">

    <meta name="description"
        content="Artha – Your personal finance and wealth management companion.">

    <title>Artha | Personal Finance</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Application Header -->
    <header class="app-header">
        <div class="brand">
            <h1>Artha</h1>
            <span>Make your money meaningful.</span>
        </div>

        <div class="header-actions">
            <button id="bell" class="icon-btn" data-go="notes"
                aria-label="Notifications" hidden>
                🔔
            </button>

            <button id="av" class="avatar" data-go="profile"
                aria-label="Open profile">
                U
            </button>
        </div>
    </header>


    <!-- Main Navigation -->
    <nav class="main-nav" aria-label="Main navigation">

        <button data-go="home" aria-current="page">
            Home
        </button>

        <button data-go="manage">
            Manage
        </button>

        <button data-go="grow">
            Grow
        </button>

        <button data-go="plan">
            Plan
        </button>

        <button data-go="enjoy">
            Enjoy
        </button>

        <button data-go="notes">
            Notifications
        </button>

        <button data-go="profile">
            Profile
        </button>

    </nav>


    <!-- Main Application Content -->
    <main>

        <!-- Home / Dashboard -->
        <section id="v-home">
        </section>


        <!-- Transactions and Budget Management -->
        <section id="v-manage" hidden>
        </section>


        <!-- Investments -->
        <section id="v-grow" hidden>
        </section>


        <!-- Goals and Milestones -->
        <section id="v-plan" hidden>
        </section>


        <!-- Vacations and Personal Experiences -->
        <section id="v-enjoy" hidden>
        </section>


        <!-- Notifications -->
        <section id="v-notes" hidden>
        </section>


        <!-- Profile and Settings -->
        <section id="v-profile" hidden>
        </section>

    </main>


    <!-- Floating Quick Add Button -->
    <button id="fab" class="fab" aria-label="Quick add">
        +
    </button>


    <!-- Toast Notification -->
    <div id="toast" role="status" aria-live="polite">
    </div>


    <!-- Reusable Dialog -->
    <dialog id="dlg">
    </dialog>


    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>
</html>
```
